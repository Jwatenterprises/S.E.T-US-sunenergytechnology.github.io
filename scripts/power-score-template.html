<!--
  S.E.T. POWER SCORE™ — Reusable Badge Templates
  Copy and paste into any product review or comparison page.
  Link the CSS: <link rel="stylesheet" href="/scripts/power-score-badge.css">

  USAGE:
  1. Full Badge — for individual product review pages (sidebar or hero section)
  2. Inline Badge — for comparison tables and product cards
  3. Update the class (elite/recommended/solid/basic), score number, and dimension bar widths
  4. Bar width = (dimension score / 20) * 100%
-->

<!-- ═══════════════════════════════════════════ -->
<!-- FULL BADGE — Example: EcoFlow Delta Pro 3  -->
<!-- ═══════════════════════════════════════════ -->

<div class="ps-badge elite">
  <span class="ps-brand">S.E.T. Power Score</span>
  <div class="ps-circle">
    <span class="ps-score-number">86</span>
    <span class="ps-score-label">/ 100</span>
  </div>
  <span class="ps-tier">S.E.T. Elite</span>
  <div class="ps-dimensions">
    <div class="ps-dim-row">
      <span class="ps-dim-label">Capacity</span>
      <div class="ps-dim-bar"><div class="ps-dim-fill capacity" style="width:90%"></div></div>
      <span class="ps-dim-score">18</span>
    </div>
    <div class="ps-dim-row">
      <span class="ps-dim-label">Efficiency</span>
      <div class="ps-dim-bar"><div class="ps-dim-fill efficiency" style="width:90%"></div></div>
      <span class="ps-dim-score">18</span>
    </div>
    <div class="ps-dim-row">
      <span class="ps-dim-label">Value</span>
      <div class="ps-dim-bar"><div class="ps-dim-fill value" style="width:70%"></div></div>
      <span class="ps-dim-score">14</span>
    </div>
    <div class="ps-dim-row">
      <span class="ps-dim-label">Durability</span>
      <div class="ps-dim-bar"><div class="ps-dim-fill durability" style="width:85%"></div></div>
      <span class="ps-dim-score">17</span>
    </div>
    <div class="ps-dim-row">
      <span class="ps-dim-label">Versatility</span>
      <div class="ps-dim-bar"><div class="ps-dim-fill versatility" style="width:95%"></div></div>
      <span class="ps-dim-score">19</span>
    </div>
  </div>
</div>
