<!DOCTYPE html>
<html><head><title>TikTok Auth Callback</title></head>
<body style="font-family:system-ui;text-align:center;padding:60px 20px;">
<h1>✅ TikTok Authorization Complete</h1>
<p>Copy the code below and paste it in the terminal:</p>
<div id="code" style="font-size:24px;background:#f0f0f0;padding:20px;border-radius:8px;margin:20px auto;max-width:600px;word-break:break-all;user-select:all;cursor:pointer;"></div>
<p style="color:#666;">Click the code to select it, then Ctrl+C to copy.</p>
<div id="error" style="color:red;display:none;"></div>
<script>
const params = new URLSearchParams(window.location.search);
const code = params.get('code');
const error = params.get('error');
if (code) {
    document.getElementById('code').textContent = code;
} else if (error) {
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = 'Error: ' + (params.get('error_description') || error);
    document.getElementById('code').textContent = 'Authorization failed';
} else {
    document.getElementById('code').textContent = 'No code received';
}
</script>
</body></html>
