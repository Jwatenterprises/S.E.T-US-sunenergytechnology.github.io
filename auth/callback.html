<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.E.T. Solar — Authorization</title>
<meta name="robots" content="noindex, nofollow">
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 80px auto; padding: 20px; background: #0a0a0a; color: #e0e0e0; }
h1 { color: #f7931e; font-size: 1.4rem; }
.code-box { background: #1a1a2e; border: 2px solid #f7931e; border-radius: 8px; padding: 20px; margin: 20px 0; word-break: break-all; font-family: monospace; font-size: 1.1rem; cursor: pointer; }
.code-box:hover { background: #252540; }
.info { color: #888; font-size: 0.9rem; margin-top: 12px; }
.copied { color: #4caf50; font-weight: bold; display: none; }
.error { color: #f44336; }
</style>
</head>
<body>
<h1>☀️ S.E.T. Solar — Instagram Authorization</h1>
<div id="result"></div>
<script>
const params = new URLSearchParams(window.location.search);
const code = params.get('code');
const error = params.get('error');
const errorReason = params.get('error_reason');
const errorDesc = params.get('error_description');
const result = document.getElementById('result');

if (code) {
  result.innerHTML = `
    <p>✅ Authorization successful! Copy this code and paste it to Kiyomi:</p>
    <div class="code-box" id="codeBox" onclick="copyCode()">${code}</div>
    <span class="copied" id="copiedMsg">✅ Copied!</span>
    <p class="info">Click the code to copy it. This is a one-time use code that expires in 60 seconds.</p>
  `;
} else if (error) {
  result.innerHTML = `
    <p class="error">❌ Authorization failed</p>
    <p><strong>Error:</strong> ${error}</p>
    <p><strong>Reason:</strong> ${errorReason || 'N/A'}</p>
    <p><strong>Details:</strong> ${errorDesc || 'N/A'}</p>
    <p class="info">Copy this entire error and paste it to Kiyomi.</p>
  `;
} else {
  result.innerHTML = `
    <p>Waiting for authorization redirect...</p>
    <p class="info">If you see this page directly, go back and start the Instagram authorization flow.</p>
  `;
}

function copyCode() {
  navigator.clipboard.writeText(code).then(() => {
    document.getElementById('copiedMsg').style.display = 'inline';
    setTimeout(() => { document.getElementById('copiedMsg').style.display = 'none'; }, 2000);
  });
}
</script>
</body>
</html>
